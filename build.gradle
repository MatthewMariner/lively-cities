plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// Pinned rather than 'latest.release' so a local build is reproducible and so the
// version this project's docs quote (README, docs/SUBMISSION.md) is the version
// actually compiled and tested against, rather than whatever the hub happened to
// resolve on the day somebody last ran a build. Bump deliberately after an OSRS
// update, the same way the README's "After an OSRS update" runbook already asks:
// run ./gradlew test, then ./run-windows.sh --audit, then update the docs together
// with this line. The Plugin Hub's own packager substitutes its own build.gradle
// for `build=standard` submissions and always builds against its own resolved
// client version regardless of what this file says — see
// docs/SUBMISSION.md#verifying-the-hub-build — so this pin affects local dev and
// test builds only, never what actually ships.
def runeLiteVersion = '1.12.37'
def pluginMainClass = 'com.matthewmariner.livelycities.LivelyCitiesPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.matthewmariner.livelycities'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// A green bar with no names is not a report. Name every test that ran.
tasks.named('test') {
	testLogging {
		events 'passed', 'skipped', 'failed'
		showStandardStreams = false
		exceptionFormat = 'full'
	}

	// Two files outside the source sets are read by tests, and Gradle cannot know
	// that on its own. Without these declarations, editing NOTICE or the top-up
	// check and running `./gradlew test` reports nothing and exits 0: the task is
	// up to date, because none of its declared inputs appeared to change, and the
	// tests that read them never run. `clean build` and CI were always fine; this
	// makes the ordinary edit-and-test loop fine too, which is where a stale
	// disclosure actually gets written.
	//
	//   NOTICE                     AuthoredRecordsTest
	//   docs/CITY-TOP-UP-CHECK.md  CityTopUpCheckTest
	//   docs/CITY-LIVERY-CHECK.md  CityLiveryCheckTest
	//   README.md                  RegionDataLoaderTest
	//   docs/SUBMISSION.md         RegionDataLoaderTest
	//
	// A test that reads a file the task does not declare is a test that does not
	// run when that file changes, which is the one moment it had a job to do.
	inputs.file(rootProject.file('NOTICE'))
		.withPropertyName('notice')
		.withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.file(rootProject.file('docs/CITY-TOP-UP-CHECK.md'))
		.withPropertyName('cityTopUpCheck')
		.withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.file(rootProject.file('docs/CITY-LIVERY-CHECK.md'))
		.withPropertyName('cityLiveryCheck')
		.withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.file(rootProject.file('README.md'))
		.withPropertyName('readme')
		.withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.file(rootProject.file('docs/SUBMISSION.md'))
		.withPropertyName('submission')
		.withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

// Same dev client as `run`, plus one system property. LivelyCitiesPlugin only
// runs the cache id audit (a real walk of every model/animation id in the
// dataset against the live cache) when this is set — see
// CACHE_AUDIT_SYSTEM_PROPERTY. Kept as a separate task rather than folded into
// `run` so an ordinary dev session never pays for it, and kept out of `test`
// entirely: it needs a live, cache-loaded client, which the unit test suite
// deliberately never has. Report lands in ~/.runelite/lively-cities/.
tasks.register('auditCacheIds', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	systemProperty 'livelycities.validateCacheIds', 'true'
	args "--developer-mode", "--debug"
}

// The frame-time stopwatch, same shape and for the same reason as auditCacheIds
// above: a dev-only capability that is compiled into the shipped jar but cannot be
// switched on by an ordinary user. FrameTimings needs BOTH this system property and
// --developer-mode, so `run` and `test` measure nothing. Play for a few minutes and a
// report lands in ~/.runelite/lively-cities/frame-timings.txt with median/p95/p99 for
// the per-tick pass, model building and the per-frame pass.
tasks.register('runWithTimings', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	systemProperty 'livelycities.frameTimings', 'true'
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
