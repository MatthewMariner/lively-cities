plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.matthewmariner.livelycities.LivelyCitiesPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.matthewmariner.livelycities'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// A green bar with no names is not a report. Name every test that ran.
tasks.named('test') {
	testLogging {
		events 'passed', 'skipped', 'failed'
		showStandardStreams = false
		exceptionFormat = 'full'
	}
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

// Same dev client as `run`, plus one system property. LivelyCitiesPlugin only
// runs the cache id audit (a real walk of every model/animation id in the
// dataset against the live cache) when this is set — see
// CACHE_AUDIT_SYSTEM_PROPERTY. Kept as a separate task rather than folded into
// `run` so an ordinary dev session never pays for it, and kept out of `test`
// entirely: it needs a live, cache-loaded client, which the unit test suite
// deliberately never has. Report lands in ~/.runelite/lively-cities/.
tasks.register('auditCacheIds', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	systemProperty 'livelycities.validateCacheIds', 'true'
	args "--developer-mode", "--debug"
}

// The frame-time stopwatch, same shape and for the same reason as auditCacheIds
// above: a dev-only capability that is compiled into the shipped jar but cannot be
// switched on by an ordinary user. FrameTimings needs BOTH this system property and
// --developer-mode, so `run` and `test` measure nothing. Play for a few minutes and a
// report lands in ~/.runelite/lively-cities/frame-timings.txt with median/p95/p99 for
// the per-tick pass, model building and the per-frame pass.
tasks.register('runWithTimings', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	systemProperty 'livelycities.frameTimings', 'true'
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
